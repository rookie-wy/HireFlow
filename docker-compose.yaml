version: '3.8'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=mysql+pymysql://root:password@db:3306/recruitment?charset=utf8mb4
      - REDIS_URL=redis://redis:6379/0
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8001
      # 生产环境请用环境变量注入强随机密钥，勿用此占位值
      - JWT_SECRET_KEY=please-change-me-in-production
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
      - chroma
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: recruitment
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
  chroma:
    image: chromadb/chroma:0.5.5
    ports:
      - "8001:8001"
    volumes:
      - chroma_data:/chroma/data
volumes:
  mysql_data:
  chroma_data:
