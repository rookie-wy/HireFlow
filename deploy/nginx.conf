# =============================================================================
# AI 招聘 Agent 系统 — 前端 nginx 站点配置（生产）
#
# 挂载位置（容器内）：/etc/nginx/conf.d/default.conf
# 由 deploy/docker-compose.yml 的 frontend 服务挂载，或手动：
#   docker run -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" ...
#
# 两件事：
#   1) 托管 Vite 构建产物 frontend/dist（SPA，需要 history 回退到 index.html）
#   2) 把 /api/ 反向代理到容器内服务名 backend:8080
# =============================================================================

server {
    listen       80;
    server_name  _;

    # 前端产物根目录（Dockerfile 已把 dist 拷到这里）
    root   /usr/share/nginx/html;
    index  index.html;

    # 上传简历最大 10MB（与 backend UPLOAD_MAX_MB 默认值保持一致）；
    # 调大后记得同步改 backend 的 UPLOAD_MAX_MB，否则后端仍会 413。
    client_max_body_size 12m;

    # 访问日志（docker logs / 挂载卷里可查）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # ---- 后端 API 反向代理 ----------------------------------------------------
    # SSE 关键点：前端用 fetch 流式读 GET /api/v1/screen/tasks/{id}/events，
    # 一旦 nginx 开启响应缓冲，事件会被攒在缓冲区里不下发，页面表现为"一直转圈没输出"。
    location /api/ {
        # ⚠️ 末尾的 `/` 不能省：proxy_pass 带 URI 时 nginx 会用它替换 location 前缀。
        #    写成 http://backend:8080（无斜杠）会把 /api/v1/auth/login 变成 /v1/auth/login → 全量 404。
        proxy_pass http://backend:8080/;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / 长连接：关闭缓冲、清空 Connection 头，读超时放到 600s
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;

        # 简历上传 + LLM 解析（JD 解析、筛选）可能耗时较久，别用默认 60s
        proxy_connect_timeout 10s;
    }

    # ---- 后端探活端点（可选，便于直接从 nginx 侧探后端） ----------------------
    location = /healthz {
        proxy_pass http://backend:8080/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- 静态资源缓存 --------------------------------------------------------
    # Vite 产物带 hash 文件名，可以放心长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---- SPA history 回退 ----------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
